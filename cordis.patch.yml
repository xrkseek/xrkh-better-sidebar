# xrkh-better-sidebar bundle patch (Host profile / plugin add)
#
# When installed via `xrkh plugin add xrkh-better-sidebar`, the Host reconciles
# profile bundles against this file and inserts the plugin row.
- insert:
    - id: better-sidebar
      name: 'xrkh-better-sidebar'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'xrkh-better-sidebar' && e.options.id !== 'better-sidebar' && !e.disabled)"
